[package]
name = "rmk-urchin"
version = "0.1.0"
edition = "2021"
description = "Keyboard firmware written in Rust"
readme = "README.md"
homepage = "https://github.com/haobogu/rmk"
repository = "https://github.com/haobogu/rmk"
license = "MIT OR Apache-2.0"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[dependencies]
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
  "critical-section-impl",
  "defmt",
  "nrf52840",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
  "central",
  "defmt",
  "nrf52840",
  "peripheral",
] }
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "6fa9805c52935432f026ab0443b463bc6fde9d6b", features = [
  "adafruit_bl",
  "async_matrix",
  "nrf52840_ble",
  "split",
] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-hal = "1.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "defmt",
  "executor-thread",
] }
embassy-nrf = { version = "0.11", features = [
  "defmt",
  "gpiote",
  "nfc-pins-as-gpio",
  "nrf52840",
  "time",
  "time-driver-rtc1",
  "unstable-pac",
] }
embassy-time = { version = "0.5", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768"
] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false
panic = "unwind"
codegen-units = 1  # better optimizations

[profile.release]
opt-level = "z"  # optimize for binary size
debug = true  # no overhead for bare-metal
overflow-checks = false
lto = "fat"
codegen-units = 1  # better optimizations
