[package]
name = "rmk-urchin"
version = "0.1.0"
edition = "2021"
description = "Keyboard firmware written in Rust"
readme = "README.md"
homepage = "https://github.com/haobogu/rmk"
repository = "https://github.com/haobogu/rmk"
license = "MIT OR Apache-2.0"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[[bin]]
name = "wipe"
path = "src/wipe.rs"

[dependencies]
bt-hci = { version = "0.11", default-features = false, features = ["defmt"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
  "critical-section-impl",
  "defmt",
  "nrf52840",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
  "central",
  "defmt",
  "nrf52840",
  "peripheral",
] }
rmk = { git = "https://github.com/rmk-rs/rmk", branch = "main", default-features = false, features = [
  "adafruit_bl",
  "async_matrix",
  "nrf52840_ble",
  "split",
  "subrating",
  "storage",
  "vial",
  "host_lock",
  "watchdog",
  "usb_log",
] }

log = { version = "0.4", features = ["max_level_debug"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
nrf-pac = { version = "0.4.0", features = ["nrf52840"] }
embedded-hal = "1.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "defmt",
  "executor-thread",
] }
embassy-nrf = { version = "0.11", features = [
  "defmt",
  "gpiote",
  "nfc-pins-as-gpio",
  "nrf52840",
  "time",
  "time-driver-rtc1",
  "unstable-pac",
] }
embassy-time = { version = "0.5", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768"
] }
panic-probe = "1.0"
static_cell = "2"

# Local fork of rmk at the locked commit, with the BLE host-link slave latency
# lowered (30/60 -> 4/0) to cut BT input lag. Upstream params are hardcoded in
# rmk/src/ble/mod.rs::set_conn_params and not configurable via keyboard.toml.
[patch."https://github.com/rmk-rs/rmk"]
rmk = { path = "vendor/rmk/rmk" }
rmk-config = { path = "vendor/rmk/rmk-config" }
rmk-macro = { path = "vendor/rmk/rmk-macro" }
rmk-types = { path = "vendor/rmk/rmk-types" }

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false
panic = "unwind"
codegen-units = 1  # better optimizations

[profile.release]
opt-level = "z"  # optimize for binary size
debug = true  # no overhead for bare-metal
overflow-checks = false
lto = "fat"
codegen-units = 1  # better optimizations
