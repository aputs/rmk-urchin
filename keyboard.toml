[keyboard]
name = "rmk-urchin"
product_name = "rmk-urchin"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
board = "nice!nano_v2"

[layout]
rows = 4
cols = 10
# 34 physical keys: rows 0-2 are full (5+5), but the thumb row (row 3) has
# only 4 keys - the inner 2 per half: (3,3) (3,4) | (3,5) (3,6).
# The 6 outer row-3 slots ((3,0)-(3,2), (3,7)-(3,9)) are unwired matrix
# placeholders; keymap entries bound there are unreachable.
# Hand markers (L/R) drive unilateral_tap in the HRM profile. Thumbs are `*` (bilateral) so
# same-side mod+thumb shortcuts like Cmd+Tab / Cmd+Space still resolve as holds.
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,R) (0,6,R) (0,7,R) (0,8,R) (0,9,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,R) (1,6,R) (1,7,R) (1,8,R) (1,9,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,R) (2,6,R) (2,7,R) (2,8,R) (2,9,R)
(3,0,*) (3,1,*) (3,2,*) (3,3,*) (3,4,*) (3,5,*) (3,6,*) (3,7,*) (3,8,*) (3,9,*)
"""

[keymap]
layers = 5

[[keymap.layer]] # layer 0
keys = """
Q D R W B J F U P BSLS
A MT(S,LGui,HRM) MT(H,LAlt,HRM) MT(T,LCtrl,HRM) MT(G,LShift,HRM) MT(Y,RShift,HRM) MT(N,RCtrl,HRM) MT(E,RAlt,HRM) MT(O,RGui,HRM) I
Z X M C V K L Comma Dot Slash
_ _ _ LT(2,ENTER,THUMB) LT(1,TAB,THUMB) LT(4,SPACE,THUMB) LT(3,Backspace,THUMB) _ _ _
"""

[[keymap.layer]] # layer 1
keys = """
Grave F1 F2 F3 F4 Left Down Up Right WM(BSLS,RCtrl)
WM(Grave,RShift) LGui LAlt LCtrl LShift 9 1 2 3 4
Escape F5 F6 F7 F8 0 5 6 7 8
_ _ _ _ No F9 F10 _ _ _
"""

[[keymap.layer]] # layer 2
keys = """
Grave _ _ _ _ F12 Delete PageUp PageDown WM(BSLS,RCtrl)
_ LGui LAlt LCtrl LShift LeftBracket Minus Equal Semicolon Quote
Escape _ _ _ _ RightBracket SHIFTED(Minus) SHIFTED(Equal) SHIFTED(Semicolon) SHIFTED(Quote)
_ _ _ _ _ _ _ _ _ _
"""

[[keymap.layer]] # layer 3
keys = """
Bootloader Reboot ClearEeprom _ User06 Mute AudioVolDown AudioVolUp MediaPlayPause MediaStop
_ _ _ _ _ _ User00 User01 User02 _
Escape _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _
"""

[[keymap.layer]] # layer 4
keys = """
Grave _ _ _ _ F12 Delete PageUp PageDown WM(BSLS,RCtrl)
_ LGui LAlt LCtrl LShift LeftBracket Minus Equal Semicolon Quote
Escape _ _ _ _ RightBracket SHIFTED(Minus) SHIFTED(Equal) SHIFTED(Semicolon) SHIFTED(Quote)
_ _ _ _ _ _ _ _ _ _
"""

[ble]
enabled = true

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.central.matrix]
row_pins = [
  "P1_13",
  "P1_11",
  "P0_10",
  "P0_09",
]
col_pins = [
  "P0_24",
  "P1_00",
  "P0_11",
  "P1_04",
  "P1_06",
]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
row_pins = [
  "P1_00",
  "P0_11",
  "P1_04",
  "P1_06",
]
col_pins = [
  "P1_15",
  "P1_13",
  "P1_11",
  "P0_10",
  "P0_09",
]

[behavior.morse]
# Default profile, used by any tap-hold key without a named profile. Every layer-0 tap-hold
# key names one of the profiles below, so these values only cover anything added later.
# NOTE: Vial can save its own copy of this default profile to flash, and that copy wins over
# this file until storage is reset. The named profiles below are compiled in and always apply.
enable_flow_tap = false
# Flow tap (HRM profile only): a home-row key pressed within this long after the previous
# key press always taps. Fast typing can't turn a letter into a modifier; a deliberate mod
# after a short pause still works.
prior_idle_time = "150ms"
permissive_hold = true
hold_on_other_press = false
hold_timeout = "200ms"
gap_timeout = "100ms"
# 0 = a single tap fires immediately on release; none of these keys use double-tap.
quick_tap_timeout = "0ms"

[behavior.morse.profiles]
# Home-row mods. Previously these shared the thumb settings and resolved on a bare 175ms
# timer, so a letter held slightly long mid-word became a modifier (seen in logs as
# N -> RCtrl+W, Y -> RShift+B). Now:
#   - flow tap: pressed during a typing burst (< prior_idle_time) -> always the letter
#   - unilateral_tap: rolling into a same-hand key -> the letter (mods are for the other hand)
#   - hold_on_other_press: other-hand key pressed -> the modifier, release order doesn't matter
#     (permissive_hold required releasing the other key first; flow tap still protects fast g->y)
#   - 250ms hold_timeout: a lone slow press needs a clearly deliberate hold to become a mod
HRM = { enable_flow_tap = true, unilateral_tap = true, permissive_hold = false, hold_on_other_press = true, hold_timeout = "250ms", gap_timeout = "100ms" }
# Thumb layer-taps. No flow tap (layers must work right after typing a letter).
# permissive_hold keeps the cross-half fix: the left thumb's events cross the BLE split
# link and can land after the right-hand key, so the decision is made when the OTHER key
# is released, not by arrival order. Release the tapped key before releasing the thumb.
THUMB = { enable_flow_tap = false, unilateral_tap = false, permissive_hold = true, hold_timeout = "200ms", gap_timeout = "100ms" }

[rmk]
split_peripherals_num = 1
ble_profiles_num = 3
debounce_time = 15 # faster per-key forwarding shrinks split round-trip latency, widening the effective tap window (raise back to 30 if you see double-presses)

[host]
unlock_keys = [[0, 5], [0, 6]]
